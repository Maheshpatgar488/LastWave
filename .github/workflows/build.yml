name: Auto Build Renamed LastWave

on:
  schedule:
    # Runs automatically every 2 hours
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if version is up to date'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version_check.outputs.should_build }}
      tag: ${{ steps.version_check.outputs.tag }}
    steps:
      - name: Check Upstream vs Fork Version
        id: version_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(gh api repos/Clash-Projects/LastWave-native/releases/latest --jq .tag_name)
          MY_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name || echo "none")

          echo "Upstream latest tag: $UPSTREAM_TAG"
          echo "Fork latest tag: $MY_TAG"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_build }}" = "true" ]; then
            echo "Manual trigger with force build enabled."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$UPSTREAM_TAG" != "$MY_TAG" ]; then
            echo "New version detected ($UPSTREAM_TAG != $MY_TAG)."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "Already up to date ($MY_TAG). Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Upstream Code
        uses: actions/checkout@v4
        with:
          repository: Clash-Projects/LastWave-native
          ref: ${{ needs.check.outputs.tag }}

      - name: Rename Package to Yandex Music
        run: |
          find . -name "build.gradle.kts" -o -name "build.gradle" | while read -r file; do
            sed -i -E 's/applicationId(\s*=\s*|\s+).*."/applicationId = "ru.yandex.music"/' "$file" 2>/dev/null || true
            sed -i -E 's/applicationId\s+".*"/applicationId "ru.yandex.music"/' "$file" 2>/dev/null || true
          done
          echo "Verified applicationId replacement:"
          grep -rn "applicationId" app/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Generate Keystore for Release Build
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias release_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=LastWave, OU=App, O=LastWave, L=City, S=State, C=US"
          
          mkdir -p app/app
          cp release.keystore app/release.keystore
          cp release.keystore app/app/release.keystore
          
          # Base64 export for LastWave's CI signing check
          SIGNING_KEY_B64=$(base64 -w 0 release.keystore)
          echo "SIGNING_KEY=$SIGNING_KEY_B64" >> $GITHUB_ENV
          echo "KEY_STORE_PASSWORD=password123" >> $GITHUB_ENV
          echo "ALIAS=release_key" >> $GITHUB_ENV
          echo "KEY_PASSWORD=password123" >> $GITHUB_ENV
          
          # Local build properties fallback
          echo "RELEASE_STORE_FILE=app/release.keystore" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=password123" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=release_key" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=password123" >> $GITHUB_ENV
          
          for f in local.properties gradle.properties .env app/local.properties; do
            echo "RELEASE_STORE_FILE=app/release.keystore" >> "$f"
            echo "RELEASE_STORE_PASSWORD=password123" >> "$f"
            echo "RELEASE_KEY_ALIAS=release_key" >> "$f"
            echo "RELEASE_KEY_PASSWORD=password123" >> "$f"
          done

      - name: Build Production Release APK
        env:
          SIGNING_KEY: ${{ env.SIGNING_KEY }}
          KEY_STORE_PASSWORD: password123
          ALIAS: release_key
          KEY_PASSWORD: password123
          RELEASE_STORE_FILE: app/release.keystore
          RELEASE_STORE_PASSWORD: password123
          RELEASE_KEY_ALIAS: release_key
          RELEASE_KEY_PASSWORD: password123
        run: ./gradlew assembleRelease

      - name: Download Uber APK Signer
        run: |
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Sign APK
        run: |
          mkdir -p unsigned_apks signed_apks
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} unsigned_apks/ \;
          java -jar uber-apk-signer-1.3.0.jar \
            --apks unsigned_apks \
            --out signed_apks \
            --allowResign \
            --overwrite

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: LastWave ${{ needs.check.outputs.tag }} (Yandex Music Package)
          draft: false
          prerelease: false
          files: signed_apks/*-aligned-debugSigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
